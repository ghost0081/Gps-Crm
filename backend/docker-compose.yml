version: '3.8'

services:
  school-backend:
    build: .
    container_name: school-backend
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:5000"
      - "5023:5023"
      - "5023:5023/udp"
    environment:
      - PORT=${PORT:-5000}
      - MONGO_URL=${MONGO_URL}
      - FACE_API_URL=http://face-recognition-api:8000

  face-recognition-api:
    build: ./face-recognition-sface-main
    container_name: face-recognition-api
    restart: always
    ports:
      - "8000:8000"
